<style>
  /* Colors and type match the Tab app (../tab/app/globals.css).
     Text pairs below all pass WCAG AA (4.5:1):
     navy and ink-muted on white/canvas/lavender-soft, purple on white/lavender-soft,
     white on purple, danger on danger-soft. */
  :root {
    --navy: #101935;
    --purple: #564787;
    --purple-hover: #46396f;
    --lavender: #dbcbd8;
    --lavender-soft: #f3edf2;
    --canvas: #f2fdff;
    --white: #ffffff;
    --ink-muted: #5a6178;
    --line: #e7dde6;
    --line-strong: #9c8ba0;
    --danger: #b42318;
    --danger-soft: #fdecea;
    --radius-card: 10px;
    --radius-control: 8px;
    --shadow-card: 0 1px 2px rgb(16 25 53 / 0.04), 0 6px 18px -10px rgb(16 25 53 / 0.14);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    background: var(--canvas);
    color: var(--navy);
    font: 13px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* One visible focus style for everything keyboard-focusable */
  :focus-visible {
    outline: 2px solid var(--purple);
    outline-offset: 2px;
  }

  button,
  select,
  input {
    font: inherit;
    color: inherit;
  }

  button {
    cursor: pointer;
  }

  button:disabled {
    cursor: not-allowed;
    opacity: 0.6;
  }

  .btn {
    border-radius: var(--radius-control);
    padding: 6px 12px;
    font-weight: 600;
    white-space: nowrap;
  }

  .btn-primary {
    border: 1px solid var(--purple);
    background: var(--purple);
    color: var(--white);
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--purple-hover);
  }

  .btn-outline {
    border: 1px solid var(--purple);
    background: var(--white);
    color: var(--purple);
  }

  .btn-outline:hover:not(:disabled) {
    background: var(--lavender-soft);
  }

  .btn-small {
    padding: 3px 8px;
    font-size: 12px;
  }

  /* ---- Header ---- */

  header {
    padding: 14px 16px 10px;
    background: var(--white);
    border-bottom: 1px solid var(--line);
  }

  .score {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }

  .score small {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-muted);
    letter-spacing: 0;
  }

  .meta {
    margin: 2px 0 0;
    color: var(--ink-muted);
  }

  /* ---- Controls ---- */

  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
  }

  .controls select {
    flex: 1;
    min-width: 0;
  }

  select,
  input[type="number"] {
    height: 30px;
    padding: 0 8px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-control);
    background: var(--white);
  }

  input[aria-invalid="true"] {
    border-color: var(--danger);
  }

  .icon-btn {
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-control);
    background: var(--white);
    font-size: 16px;
    line-height: 1;
  }

  .icon-btn[aria-expanded="true"] {
    background: var(--lavender-soft);
    border-color: var(--purple);
  }

  .drawer {
    margin-top: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    background: var(--lavender-soft);
  }

  .field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .field + .field {
    margin-top: 8px;
  }

  .field label {
    font-weight: 600;
  }

  .field select,
  .field input {
    width: 84px;
  }

  .hint {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--ink-muted);
  }

  .hint.invalid {
    color: var(--danger);
  }

  /* ---- Status ---- */

  .status {
    margin: 10px 0 0;
    min-height: 18px;
  }

  .status:empty {
    display: none;
  }

  .status.error {
    padding: 6px 8px;
    border-radius: var(--radius-control);
    background: var(--danger-soft);
    color: var(--danger);
  }

  .progress {
    margin-top: 10px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .progress-track {
    height: 6px;
    margin-top: 6px;
    border-radius: 999px;
    background: var(--lavender-soft);
    overflow: hidden;
  }

  .progress-fill {
    width: 0;
    height: 100%;
    background: var(--purple);
    transition: width 120ms;
  }

  @media (prefers-reduced-motion: reduce) {
    .progress-fill {
      transition: none;
    }
  }

  .failures {
    margin: 6px 0 0;
    padding: 6px 8px 6px 24px;
    border-radius: var(--radius-control);
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 12px;
  }

  .failures:empty {
    display: none;
  }

  /* ---- Results ---- */

  main {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px 16px;
  }

  .results-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .results-top h2 {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .empty {
    margin: 24px 0;
    text-align: center;
    color: var(--ink-muted);
  }

  .notice {
    margin: 0 0 10px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    background: var(--lavender-soft);
  }

  .notice strong {
    display: block;
  }

  .all-clear {
    margin: 24px 0;
    text-align: center;
  }

  .all-clear strong {
    display: block;
    font-size: 18px;
  }

  .all-clear span {
    color: var(--ink-muted);
  }

  .more {
    display: block;
    margin: 0 auto 8px;
  }

  .more[hidden] {
    display: none;
  }

  .section {
    margin-bottom: 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    background: var(--white);
    box-shadow: var(--shadow-card);
  }

  .section-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px 4px 4px;
  }

  .toggle {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    padding: 6px;
    border: 0;
    border-radius: var(--radius-control);
    background: none;
    font-weight: 600;
    text-align: left;
  }

  .toggle::before {
    content: "▸";
    color: var(--ink-muted);
    transition: transform 120ms;
  }

  .toggle[aria-expanded="true"]::before {
    transform: rotate(90deg);
  }

  .count {
    min-width: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--lavender-soft);
    color: var(--purple);
    font-size: 12px;
    text-align: center;
  }

  .count.zero {
    color: var(--ink-muted);
  }

  .issues {
    margin: 0;
    padding: 0;
    list-style: none;
    border-top: 1px solid var(--line);
  }

  .issue {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 8px 8px 0;
  }

  .issue + .issue {
    border-top: 1px solid var(--line);
  }

  .issue-main {
    flex: 1;
    min-width: 0;
    padding: 2px 4px 2px 12px;
    border: 0;
    border-radius: var(--radius-control);
    background: none;
    text-align: left;
  }

  .issue-main:hover {
    background: var(--lavender-soft);
  }

  .layer {
    display: block;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tag {
    margin-left: 4px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 11px;
    font-weight: 600;
  }

  .message,
  .suggestion {
    display: block;
    margin-top: 2px;
  }

  .suggestion {
    color: var(--ink-muted);
  }

  .issue .btn {
    margin-top: 2px;
  }

  .none {
    margin: 0;
    padding: 8px 12px 10px;
    border-top: 1px solid var(--line);
    color: var(--ink-muted);
  }
</style>

<header>
  <p class="score" id="score">No scan yet</p>
  <p class="meta" id="meta">Choose a scope and scan.</p>

  <div class="controls">
    <select id="scope" aria-label="Scope">
      <option value="selection">Selection</option>
      <option value="page" selected>Current page</option>
      <option value="allPages">All pages</option>
    </select>
    <button class="btn btn-primary" id="scan" data-action>Scan</button>
    <button class="icon-btn" id="settingsToggle" aria-expanded="false" aria-controls="drawer" aria-label="Settings" title="Settings">⚙</button>
  </div>

  <div class="drawer" id="drawer" hidden>
    <div class="field">
      <label for="gridSize">Grid size</label>
      <select id="gridSize">
        <option value="4">4px</option>
        <option value="8" selected>8px</option>
      </select>
    </div>
    <div class="field">
      <label for="deltaE">Color match (Delta E)</label>
      <input id="deltaE" type="number" min="1" max="20" step="0.5" value="5" aria-describedby="deltaHint" />
    </div>
    <p class="hint" id="deltaHint">1 to 20. Lower is stricter. Default 5.</p>
  </div>

  <div class="progress" id="progress" hidden>
    <div class="progress-row">
      <span id="progressLabel">Starting…</span>
      <button class="btn btn-outline btn-small" id="cancel" hidden>Cancel</button>
    </div>
    <div class="progress-track" id="progressBar" role="progressbar" aria-labelledby="progressLabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <ul class="failures" id="failures" aria-label="Fix failures"></ul>
</header>

<main id="results">
  <p class="empty" id="empty">Run a scan to see issues.</p>
</main>

<script>
  const $ = (id) => document.getElementById(id);

  // Fixed order and display names for the rule sections
  const RULES = [
    { rule: "hardcodedColor", title: "Hardcoded colors" },
    { rule: "offGridSpacing", title: "Off-grid spacing" },
    { rule: "lowContrast", title: "Low contrast" },
    { rule: "textStyle", title: "Text styles" },
  ];

  const DEFAULT_DELTA_E = 5;
  const UNDO_KEY = /Mac/.test(navigator.platform) ? "Cmd+Z" : "Ctrl+Z";
  const PAGE_SIZE = 50; // issues rendered per section at a time, so thousands of issues don't freeze the panel
  const PHASE_LABELS = { collect: "Reading layers", rules: "Checking rules", fix: "Applying fixes" };

  let busy = false;
  let hasResults = false; // whether the results area shows a finished scan
  const expanded = {}; // rule -> true/false, remembered across rescans

  function send(message) {
    parent.postMessage({ pluginMessage: message }, "*");
  }

  // Builds an element. Text always goes through textContent, so layer names can't inject HTML.
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function setStatus(text, kind) {
    const status = $("status");
    status.textContent = text;
    status.className = "status" + (kind ? " " + kind : "");
  }

  function setProgress(label, percent) {
    $("progressLabel").textContent = label;
    $("progressFill").style.width = percent + "%";
    $("progressBar").setAttribute("aria-valuenow", String(percent));
  }

  function setCancelable(value) {
    const cancel = $("cancel");
    cancel.hidden = !value;
    cancel.disabled = false;
    cancel.textContent = "Cancel";
  }

  function setBusy(value, label) {
    busy = value;
    for (const button of document.querySelectorAll("[data-action]")) button.disabled = value || button.dataset.empty === "true";
    $("progress").hidden = !value;
    if (value) {
      // Starting something new clears the last fix status and error
      setStatus("");
      $("failures").replaceChildren();
      setProgress(label, 0);
    } else {
      setCancelable(false);
    }
  }

  // ---- Settings ----

  function readDeltaE() {
    const value = Number($("deltaE").value);
    const valid = $("deltaE").value !== "" && Number.isFinite(value) && value >= 1 && value <= 20;
    $("deltaE").setAttribute("aria-invalid", String(!valid));
    $("deltaHint").classList.toggle("invalid", !valid);
    $("deltaHint").textContent = valid
      ? "1 to 20. Lower is stricter. Default 5."
      : `Enter a number from 1 to 20. Using ${DEFAULT_DELTA_E} until then.`;
    return valid ? value : DEFAULT_DELTA_E;
  }

  function currentPrefs() {
    return {
      scope: $("scope").value,
      settings: { gridSize: Number($("gridSize").value), deltaEThreshold: readDeltaE() },
    };
  }

  function savePrefs() {
    send({ type: "savePrefs", ...currentPrefs() });
  }

  $("scope").onchange = savePrefs;
  $("gridSize").onchange = savePrefs;
  $("deltaE").oninput = readDeltaE;
  $("deltaE").onchange = savePrefs;

  $("settingsToggle").onclick = () => {
    const open = $("drawer").hidden;
    $("drawer").hidden = !open;
    $("settingsToggle").setAttribute("aria-expanded", String(open));
  };

  // ---- Actions ----

  function scan() {
    setBusy(true, "Starting scan…");
    setCancelable(true);
    send({ type: "scan", ...currentPrefs() });
  }

  function fix(issueIds) {
    if (issueIds.length === 0) return;
    setBusy(true, issueIds.length === 1 ? "Fixing 1 issue…" : `Fixing ${issueIds.length} issues…`);
    // Fixes can't be cancelled partway, only the rescan that follows them
    setCancelable(false);
    send({ type: "fix", issueIds });
  }

  $("scan").onclick = scan;

  $("cancel").onclick = () => {
    $("cancel").disabled = true;
    $("cancel").textContent = "Cancelling…";
    send({ type: "cancel" });
  };

  function fixableIds(issues) {
    return issues.filter((issue) => issue.fix).map((issue) => issue.id);
  }

  function actionButton(label, className, ids) {
    const button = el("button", className, label);
    button.dataset.action = "";
    button.dataset.empty = String(ids.length === 0);
    button.disabled = busy || ids.length === 0;
    button.onclick = (event) => {
      event.stopPropagation(); // a Fix click must never also select the layer
      fix(ids);
    };
    return button;
  }

  // ---- Rendering ----

  function renderHeader(msg) {
    const s = msg.summary;
    const score = $("score");
    score.replaceChildren();
    if (s.score === null) {
      score.textContent = "Nothing to check";
    } else {
      score.append(String(s.score) + "% ", el("small", "", "on-system"));
    }
    const layers = s.checkedLayers === 1 ? "1 layer" : `${s.checkedLayers} layers`;
    $("meta").textContent = `Checked ${layers} in ${msg.ms}ms`;
  }

  // fixes is null unless this message follows a fix. note is any extra sentence to show with it.
  function renderFixStatus(fixes, note) {
    const parts = [];
    if (fixes) {
      if (fixes.succeeded > 0) parts.push(`Fixed ${fixes.succeeded}. Press ${UNDO_KEY} in Figma to undo.`);
      else parts.push("Nothing was fixed.");
    }
    if (note) parts.push(note);
    if (fixes && fixes.failures.length > 0) parts.push(`${fixes.failures.length} could not be fixed:`);
    setStatus(parts.join(" "));
    $("failures").replaceChildren();
    if (fixes) for (const reason of fixes.failures) $("failures").appendChild(el("li", "", reason));
  }

  function renderIssue(issue) {
    const li = el("li", "issue");

    const main = el("button", "issue-main");
    main.title = "Select and zoom to this layer";
    const layer = el("span", "layer", issue.nodeName);
    if (issue.severity === "error") layer.appendChild(el("span", "tag", "Error"));
    main.append(layer, el("span", "message", issue.message));
    if (issue.suggestion) main.appendChild(el("span", "suggestion", issue.suggestion));
    main.onclick = () => send({ type: "select", nodeId: issue.nodeId });
    li.appendChild(main);

    if (issue.fix) li.appendChild(actionButton("Fix", "btn btn-outline btn-small", [issue.id]));
    return li;
  }

  // Renders the first PAGE_SIZE issues, with a button that adds the next PAGE_SIZE each click
  function renderIssueList(issues) {
    const wrap = el("div");
    const list = el("ul", "issues");
    const more = el("button", "btn btn-outline btn-small more");
    let shown = 0;

    function showMore() {
      const end = Math.min(shown + PAGE_SIZE, issues.length);
      for (let i = shown; i < end; i++) list.appendChild(renderIssue(issues[i]));
      shown = end;
      const left = issues.length - shown;
      more.hidden = left === 0;
      more.textContent = `Show ${Math.min(PAGE_SIZE, left)} more`;
    }

    more.onclick = showMore;
    showMore();
    wrap.append(list, more);
    return wrap;
  }

  function renderSection({ rule, title }, issues) {
    const section = el("section", "section");
    const count = issues.length;
    // Empty sections are always collapsed. Otherwise keep what the user chose, defaulting to open.
    const open = count > 0 && expanded[rule] !== false;

    const head = el("div", "section-head");
    const toggle = el("button", "toggle");
    toggle.setAttribute("aria-expanded", String(open));
    toggle.append(el("span", "", title), el("span", count === 0 ? "count zero" : "count", String(count)));
    head.appendChild(toggle);

    const ids = fixableIds(issues);
    if (ids.length > 0) head.appendChild(actionButton(`Fix all (${ids.length})`, "btn btn-outline btn-small", ids));
    section.appendChild(head);

    const body = count > 0 ? renderIssueList(issues) : el("p", "none", "No issues.");
    body.hidden = !open;
    section.appendChild(body);

    toggle.onclick = () => {
      const next = body.hidden;
      body.hidden = !next;
      toggle.setAttribute("aria-expanded", String(next));
      if (count > 0) expanded[rule] = next;
    };
    return section;
  }

  function renderNoTokensNotice() {
    const notice = el("div", "notice");
    notice.append(
      el("strong", "", "No color tokens found in this file"),
      el("span", "", "Hardcoded colors can't be matched to a token until the file has color variables or styles."),
    );
    return notice;
  }

  function renderAllClear(summary) {
    if (summary.score === null) {
      return el("p", "empty", "Nothing in this scope has colors, spacing, or text to check.");
    }
    const box = el("div", "all-clear");
    const layers = summary.checkedLayers === 1 ? "1 layer" : `${summary.checkedLayers} layers`;
    box.append(el("strong", "", "All clear"), el("span", "", `${summary.score}% on-system across ${layers}.`));
    return box;
  }

  function renderResults(msg) {
    const results = $("results");
    results.replaceChildren();
    hasResults = true;

    // The other rules still work without color tokens, so the results are shown below this
    if (msg.colorTokenCount === 0) results.appendChild(renderNoTokensNotice());

    if (msg.issues.length === 0) {
      results.appendChild(renderAllClear(msg.summary));
      return;
    }

    const top = el("div", "results-top");
    top.appendChild(el("h2", "", msg.issues.length === 1 ? "1 issue" : `${msg.issues.length} issues`));
    const allIds = fixableIds(msg.issues);
    top.appendChild(actionButton(`Fix all (${allIds.length})`, "btn btn-primary btn-small", allIds));
    results.appendChild(top);

    // Group in one pass instead of filtering the full list once per rule
    const byRule = {};
    for (const info of RULES) byRule[info.rule] = [];
    for (const issue of msg.issues) if (byRule[issue.rule]) byRule[issue.rule].push(issue);
    for (const info of RULES) results.appendChild(renderSection(info, byRule[info.rule]));
  }

  function renderEmptySelection() {
    $("score").textContent = "Nothing selected";
    $("meta").textContent = "";
    $("results").replaceChildren(el("p", "empty", "Select at least one layer, or switch scope."));
    hasResults = false;
  }

  function readableError(message) {
    const text = String(message || "Unknown error").trim();
    const sentence = /[.!?]$/.test(text) ? text : text + ".";
    return `Something went wrong: ${sentence} Try scanning again.`;
  }

  // ---- Messages from the plugin ----

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === "prefs") {
      $("scope").value = msg.scope;
      $("gridSize").value = String(msg.settings.gridSize);
      $("deltaE").value = String(msg.settings.deltaEThreshold);
      readDeltaE();
    } else if (msg.type === "progress") {
      if (!busy) return; // a late message after the scan already finished
      const percent = msg.total === 0 ? 100 : Math.floor((msg.done * 100) / msg.total);
      setProgress(`${PHASE_LABELS[msg.phase] || "Working"}… ${percent}%`, percent);
      // The rescan after a fix can be cancelled, so show the button once it starts
      if (msg.phase !== "fix" && $("cancel").hidden) setCancelable(true);
    } else if (msg.type === "results") {
      setBusy(false);
      renderHeader(msg);
      renderResults(msg);
      renderFixStatus(msg.fixes);
    } else if (msg.type === "emptySelection") {
      setBusy(false);
      renderEmptySelection();
      renderFixStatus(msg.fixes);
    } else if (msg.type === "cancelled") {
      setBusy(false);
      let note = "Scan cancelled.";
      if (msg.fixes) note = "The rescan was cancelled, so the list below is out of date. Scan again to refresh.";
      else if (hasResults) note = "Scan cancelled. The results below are from the previous scan.";
      renderFixStatus(msg.fixes, note);
    } else if (msg.type === "selectError") {
      setStatus(msg.message, "error");
    } else if (msg.type === "error") {
      setBusy(false);
      setStatus(readableError(msg.message), "error");
    }
  };

  send({ type: "ready" });
</script>
