<button id="scan">Scan page</button>
<p id="status"></p>
<p>Score: <span id="score">-</span></p>
<p>Issues: <span id="count">-</span></p>
<ul id="rules"></ul>
<ol id="issues"></ol>
<script>
  const $ = (id) => document.getElementById(id);

  // textContent (not innerHTML) so layer names can't inject HTML
  function addItem(list, text) {
    const li = document.createElement("li");
    li.textContent = text;
    list.appendChild(li);
  }

  $("scan").onclick = () => {
    $("status").textContent = "Scanning...";
    parent.postMessage({ pluginMessage: { type: "scan", scope: "page" } }, "*");
  };

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    $("rules").replaceChildren();
    $("issues").replaceChildren();

    if (msg.type === "error") {
      $("status").textContent = "Error: " + msg.message;
      return;
    }
    if (msg.type !== "results") return;

    const s = msg.summary;
    $("status").textContent = `Checked ${s.checkedLayers} layers in ${msg.ms}ms`;
    $("score").textContent = s.score === null ? "nothing to check" : s.score + "%";
    $("count").textContent = s.issueCount;
    for (const [rule, count] of Object.entries(s.countsByRule)) addItem($("rules"), `${rule}: ${count}`);
    for (const issue of msg.issues) addItem($("issues"), `${issue.nodeName}: ${issue.message}`);
  };
</script>
